task_id: improve-paper-harness-reliability
title: Improve paper trading harness reliability with Codex Autoresearch
repo_path: /Users/scottho/trading-data-tools/hermes_trading_harness
mode: worktree
base_branch: main
work_branch: symphony/improve-paper-harness-reliability

goal: Reduce paper-trading resolver errors without enabling live execution.
background: Use Codex Autoresearch for a bounded paper-trading reliability improvement with deterministic pytest and compile guards.

allowed_scope:
  - hermes_trading_harness/
  - tests/
  - scripts/
  - docs/

forbidden_paths:
  - ".env"
  - ".env.local"
  - "secrets/"
  - "*.key"
  - "*.pem"
  - "wallet.dat"

forbidden_patterns:
  - "EXECUTION_ENABLED=true"
  - "LIVE_TRADING=true"
  - "place_order("
  - "submit_order("
  - "send_order("
  - "real_money"
  - "private_key"

verify_command: "pytest -q"
guard_command: "python -m compileall . && ! grep -R \"EXECUTION_ENABLED=true\" ."

worker:
  type: codex_autoresearch
  command: codex
  timeout_seconds: 7200

metric:
  name: failing_tests
  command: "pytest -q"
  parser: failing_tests
  direction: lower
  target: 0

autoresearch:
  max_iterations: 20
  mode: foreground
  retain_policy: improve_only
  results_dir: autoresearch-results

acceptance_criteria:
  - pytest passes or failing test count is lower than baseline.
  - No live execution is enabled.
  - No order placement code is activated.
  - No secrets, wallet files, or broker credentials are modified.
  - Guard command passes.

safety_profile: trading
worker_type: codex_autoresearch
worker_command: codex
max_attempts: 1
current_attempt: 0
status: new
created_at: "2026-05-05T00:00:00+00:00"
updated_at: "2026-05-05T00:00:00+00:00"
