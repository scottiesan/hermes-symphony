task_id: reduce-failing-tests
title: Reduce failing tests with Codex Autoresearch
repo_path: .
mode: worktree
base_branch: main
work_branch: symphony/reduce-failing-tests

goal: Reduce failing pytest failures.
background: Use Codex Autoresearch only because this task has a mechanical failing-test metric and deterministic verify/guard commands.

allowed_scope:
  - src/
  - tests/

forbidden_paths:
  - ".env"
  - ".env.local"
  - "secrets/"
  - "*.key"
  - "*.pem"

forbidden_patterns:
  - "private_key"
  - "API_SECRET"

verify_command: "pytest -q"
guard_command: "python -m compileall ."

worker:
  type: codex_autoresearch
  command: codex
  timeout_seconds: 3600

metric:
  name: failing_tests
  command: "pytest -q"
  parser: failing_tests
  direction: lower
  target: 0

autoresearch:
  max_iterations: 20
  mode: foreground
  retain_policy: improve_only
  results_dir: autoresearch-results

acceptance_criteria:
  - Failing test count is lower than baseline or zero.
  - Guard command passes.
  - No forbidden paths are changed.
  - No forbidden patterns appear in diff.

worker_type: codex_autoresearch
worker_command: codex
max_attempts: 1
current_attempt: 0
status: new
created_at: "2026-05-05T00:00:00+00:00"
updated_at: "2026-05-05T00:00:00+00:00"
