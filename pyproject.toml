[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-symphony"
version = "0.2.0"
description = "Hermes-native Symphony orchestration runtime for isolated Codex workers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
hermes-symphony = "hermes_symphony:main"

[tool.setuptools]
py-modules = ["hermes_symphony"]
package-dir = {"" = "scripts"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
